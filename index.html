<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polední menu — Brno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f0f0d;
      --surface: #171714;
      --sur2:    #1f1f1c;
      --border:  #2c2c28;
      --accent:  #e0913f;
      --text:    #edebe4;
      --muted:   #78756e;
      --price:   #6dba74;
      --soup-bg: #121a14;
      --soup:    #55ad8e;
      --slbl:    #3a6e52;
      --err:     #d95555;
      --gold:    #e0b84a;
      --r:       6px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding-bottom: 80px;
    }

    /* ── Header ──────────────────────────────────── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap;
    }

    .logo {
      font-size: .95rem; font-weight: 700; color: var(--text);
      white-space: nowrap; letter-spacing: -.02em;
    }
    .logo span { color: var(--accent); }

    .tabs { display: flex; }
    .tab {
      background: none; border: 1px solid var(--border); cursor: pointer;
      padding: 7px 18px; font-family: inherit;
      font-size: .78rem; font-weight: 500; color: var(--muted);
      transition: color .15s, background .15s, border-color .15s;
      white-space: nowrap;
    }
    .tab:first-child { border-radius: var(--r) 0 0 var(--r); }
    .tab:last-child  { border-radius: 0 var(--r) var(--r) 0; margin-left: -1px; }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); z-index: 1; position: relative; }
    .tab:not(.active):hover { color: var(--text); }

    .header-right { display: flex; align-items: center; gap: 6px; }

    #refresh-btn, #cal-btn {
      background: none; border: 1px solid var(--border);
      color: var(--muted); border-radius: var(--r);
      width: 34px; height: 34px; cursor: pointer; font-size: .95rem;
      display: flex; align-items: center; justify-content: center;
      transition: color .15s, border-color .15s; font-family: inherit;
    }
    #refresh-btn:hover, #cal-btn:hover { color: var(--text); border-color: var(--muted); }
    #refresh-btn:active { transform: rotate(180deg); }
    #refresh-btn:disabled { opacity: .3; cursor: default; }
    #cal-btn.active { color: var(--accent); border-color: var(--accent); }

    /* ── Calendar ────────────────────────────────── */
    #calendar-wrap {
      max-width: 308px; margin: 12px auto;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); overflow: hidden;
    }

    .cal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; border-bottom: 1px solid var(--border);
    }
    .cal-month { font-weight: 600; font-size: .82rem; letter-spacing: -.01em; }
    .cal-nav {
      background: none; border: 1px solid var(--border);
      color: var(--muted); border-radius: 4px; width: 26px; height: 26px;
      cursor: pointer; font-size: .85rem; display: flex; align-items: center; justify-content: center;
      transition: color .12s, border-color .12s; font-family: inherit;
    }
    .cal-nav:hover { color: var(--text); border-color: var(--muted); }

    .cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      padding: 8px 8px 10px; gap: 2px;
    }

    .cal-cell {
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      border-radius: 4px; font-size: .72rem; cursor: default; position: relative;
    }
    .cal-cell.weekday-label { color: var(--muted); font-size: .6rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
    .cal-cell.other-month { color: var(--border); }
    .cal-cell.today { color: var(--accent); font-weight: 700; }
    .cal-cell.today::after {
      content: ''; position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%);
      width: 3px; height: 3px; border-radius: 50%; background: var(--accent);
    }
    .cal-cell.has-data { cursor: pointer; color: var(--text); background: var(--sur2); }
    .cal-cell.has-data:hover { background: rgba(224,145,63,.18); }
    .cal-cell.selected { background: var(--accent) !important; color: #fff !important; font-weight: 600; }
    .cal-cell.weekend:not(.has-data):not(.selected) { color: var(--muted); }

    /* ── Status ──────────────────────────────────── */
    #status {
      text-align: center; padding: 8px 20px;
      font-size: .7rem; color: var(--muted); min-height: 28px; letter-spacing: .01em;
    }

    /* ── Grid ────────────────────────────────────── */
    .grid {
      max-width: 1200px; margin: 0 auto;
      padding: 16px 24px 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 10px;
    }

    /* ── Cards ───────────────────────────────────── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); display: flex; flex-direction: column;
      transition: border-color .2s;
    }
    .card:hover { border-color: rgba(224,145,63,.4); }

    .card-head {
      padding: 14px 16px 12px;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
    }
    .card-name { font-weight: 700; font-size: .95rem; color: var(--text); letter-spacing: -.02em; line-height: 1.2; }
    .card-sub { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
    .card-link { font-size: .67rem; color: var(--muted); text-decoration: none; }
    .card-link:hover { color: var(--accent); }
    .card-addr { font-size: .67rem; color: var(--muted); }
    .card-icon { font-size: 1.35rem; opacity: .4; flex-shrink: 0; line-height: 1; margin-top: 1px; }
    .card-divider { height: 1px; background: var(--border); }
    .card-body { padding: 10px 16px 14px; flex: 1; }

    .stars { color: var(--gold); font-size: .72rem; letter-spacing: 1px; }
    .rating-num { color: var(--muted); font-size: .7rem; margin-left: 3px; }
    .dist-badge { background: var(--sur2); border-radius: 10px; padding: 2px 7px; font-size: .66rem; color: var(--muted); }

    /* ── Menu items ──────────────────────────────── */
    .item {
      display: grid; grid-template-columns: 16px 1fr auto;
      gap: 7px; align-items: baseline;
      padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.05);
    }
    .item:last-child { border-bottom: none; }

    .soup-block {
      background: var(--soup-bg);
      border-left: 2px solid var(--soup);
      border-radius: 0 4px 4px 0;
      padding: 7px 10px; margin: 0 -10px 8px;
    }
    .slbl { font-size: .56rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--slbl); margin-bottom: 3px; }
    .soup-row { display: flex; gap: 8px; align-items: baseline; }
    .soup-block .iname { color: var(--soup); font-style: italic; }

    .inum  { color: var(--muted); font-size: .65rem; text-align: right; font-variant-numeric: tabular-nums; }
    .iname { font-size: .82rem; line-height: 1.45; }
    .iprice { color: var(--price); font-size: .74rem; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }

    /* ── Fallback links ──────────────────────────── */
    .link-row { display: flex; flex-direction: column; gap: 6px; padding-top: 2px; }
    .ext-link {
      display: flex; align-items: center; gap: 8px;
      background: var(--sur2); border: 1px solid var(--border);
      border-radius: var(--r); padding: 8px 12px; text-decoration: none;
      color: var(--text); font-size: .79rem; transition: border-color .15s;
    }
    .ext-link:hover { border-color: var(--accent); color: var(--accent); }
    .ext-link .el-icon { font-size: .9rem; }
    .ext-link .el-text { flex: 1; }
    .ext-link .el-arrow { color: var(--muted); font-size: .7rem; }

    /* ── States ──────────────────────────────────── */
    .card-empty { color: var(--muted); font-size: .8rem; font-style: italic; padding: 2px 0; }
    .card-err   { color: var(--err);   font-size: .76rem; }

    .sk {
      background: linear-gradient(90deg, var(--sur2) 25%, var(--border) 50%, var(--sur2) 75%);
      background-size: 200% 100%; animation: sh 1.6s infinite;
      border-radius: 3px; height: 11px; margin-bottom: 9px; opacity: .7;
    }
    @keyframes sh { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    .panel-msg {
      max-width: 340px; margin: 80px auto; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .panel-msg .pm-icon { font-size: 2.4rem; }
    .panel-msg h2 { color: var(--text); font-size: 1rem; font-weight: 600; letter-spacing: -.02em; }
    .panel-msg p { color: var(--muted); font-size: .82rem; line-height: 1.6; }
    .btn-primary {
      background: var(--accent); color: #fff; border: none;
      border-radius: var(--r); padding: 9px 22px; font-size: .84rem;
      font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .btn-primary:hover { opacity: .88; }

    @keyframes spin { to { transform: rotate(360deg); } }

    footer { margin-top: 40px; text-align: center; color: var(--muted); font-size: .68rem; opacity: .5; }

    @media (max-width: 520px) {
      header { padding: 10px 16px; }
      .grid { padding: 12px 16px 0; gap: 8px; }
      .tab { padding: 6px 12px; font-size: .76rem; }
      #calendar-wrap { margin: 10px 16px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Polední menu <span>Brno</span></div>
  <div class="header-right">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('mine')">Moje hospody</button>
      <button class="tab"        onclick="switchTab('nearby')">📍 V okolí</button>
    </div>
    <button id="cal-btn" onclick="toggleCalendar()" title="Kalendář">📅</button>
    <button id="refresh-btn" onclick="refreshToday()" title="Obnovit dnešní menu">↺</button>
  </div>
</header>


<!-- Panel: Moje hospody -->
<div id="panel-mine">
  <!-- Calendar -->
  <div id="calendar-wrap" hidden>
    <div class="cal-header">
      <button class="cal-nav" id="cal-prev" onclick="calNav(-1)">‹</button>
      <div class="cal-month" id="cal-month-label"></div>
      <button class="cal-nav" id="cal-next" onclick="calNav(1)">›</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <div id="status"></div>
  <div class="grid" id="grid-mine"></div>
</div>

<!-- Panel: V okolí -->
<div id="panel-nearby" hidden>
  <div id="nearby-content"></div>
</div>

<footer id="foot"></footer>

<script>
// ─── Config ────────────────────────────────────────────────────────────────

const FIXED = [
  { id:'suzies',   name:"Suzie's Steak Pub",  menickaId:3830, url:'https://www.menicka.cz/3830-suzies-steak-pub.html',    type:'menicka' },
  { id:'seminar',  name:'Hostinec U Semináru', menickaId:3197, url:'https://www.menicka.cz/3197-hostinec-u-seminaru.html', type:'menicka' },
  { id:'kormidlo', name:'U Kormidla',           menickaId:6690, url:'https://www.menicka.cz/6690-u-kormidla.html',          type:'menicka' },
  { id:'laguna',   name:'Restaurace Laguna',    menickaId:2701, url:'https://www.menicka.cz/2701-restaurace-laguna.html',   type:'menicka' },
  { id:'garden',   name:'Garden Food Concept',  menickaId:6361, url:'https://www.menicka.cz/6361-garden-food-concept.html', type:'menicka' },
];
const ICONS = { suzies:'🥩', seminar:'🍺', kormidlo:'⚓', laguna:'🐟', garden:'🌿' };

// Multiple CORS proxies tried in order — first success wins
const PROXIES = [
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
  u => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
];
const REPO   = 'itsjakubmazur/menu';
const BRANCH = 'main';
// For GitHub Pages: read data from raw content. For localhost: relative path.
const dataUrl = (file) => {
  if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return `data/${file}`;
  return `https://raw.githubusercontent.com/${REPO}/refs/heads/${BRANCH}/data/${file}`;
};

const CS_DAYS   = ['Neděle','Pondělí','Úterý','Středa','Čtvrtek','Pátek','Sobota'];
const CS_MONTHS = ['ledna','února','března','dubna','května','června','července','srpna','září','října','listopadu','prosince'];
const CS_MONTHS_SHORT = ['Led','Úno','Bře','Dub','Kvě','Čvn','Čvc','Srp','Zář','Říj','Lis','Pro'];

// ─── State ────────────────────────────────────────────────────────────────

let availableDates = new Set();   // dates that have data in the repo
let calYear, calMonth;            // currently displayed calendar month
let selectedDate;                 // currently selected date
let activeTab = 'mine';
let nearbyLoaded = false;

// ─── Storage ──────────────────────────────────────────────────────────────

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

const store = {
  dayCache(date) {
    try { const r = localStorage.getItem(`menu-${date}`); return r ? JSON.parse(r) : null; } catch { return null; }
  },
  setDayCache(date, d) { try { localStorage.setItem(`menu-${date}`, JSON.stringify(d)); } catch {} },
  nearbyCache() {
    try { const r = localStorage.getItem('menu-nearby-'+todayStr()); return r ? JSON.parse(r) : null; } catch { return null; }
  },
  setNearbyCache(d) { try { localStorage.setItem('menu-nearby-'+todayStr(), JSON.stringify(d)); } catch {} },
};

// ─── Helpers ──────────────────────────────────────────────────────────────

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  return `${CS_DAYS[d.getDay()]} ${d.getDate()}. ${CS_MONTHS[d.getMonth()]}`;
}

function fmtDist(m) { return m < 1000 ? `${Math.round(m)} m` : `${(m/1000).toFixed(1)} km`; }

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
  const Δφ = (lat2 - lat1) * Math.PI / 180, Δλ = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(Δφ/2)**2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function renderStars(r) {
  const n = Math.round(r * 2) / 2;
  let s = '';
  for (let i = 1; i <= 5; i++) s += i <= n ? '★' : (i-.5 === n ? '½' : '☆');
  return `<span class="stars">${s}</span><span class="rating-num">${r.toFixed(1)}</span>`;
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }

// ─── Network ──────────────────────────────────────────────────────────────

async function fetchHtml(url, timeout = 12000) {
  let lastErr;
  for (const makeProxy of PROXIES) {
    const ctrl = new AbortController();
    const tid = setTimeout(() => ctrl.abort(), timeout);
    try {
      const res = await fetch(makeProxy(url), { signal: ctrl.signal });
      clearTimeout(tid);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const ct = res.headers.get('content-type') ?? '';
      if (ct.includes('json')) {
        const j = await res.json();
        const c = j.contents ?? j.body ?? '';
        if (!c) throw new Error('empty json');
        return c;
      }
      // Decode with correct charset — menicka.cz uses windows-1250, not UTF-8
      const buf = await res.arrayBuffer();
      const prefix = new TextDecoder('latin1').decode(buf.slice(0, 2048));
      const metaCharset = prefix.match(/charset=["']?([\w-]+)/i)?.[1];
      if (metaCharset && !/utf-?8/i.test(metaCharset)) {
        try { return new TextDecoder(metaCharset).decode(buf); } catch {}
      }
      return new TextDecoder('utf-8').decode(buf);
    } catch (e) {
      clearTimeout(tid);
      lastErr = e;
      // AbortError or HTTP error → try next proxy
    }
  }
  throw new Error(lastErr?.message ?? 'all proxies failed');
}

async function fetchJson(url, timeout = 8000) {
  const res = await fetch(url + '?v=' + Date.now(), { signal: AbortSignal.timeout(timeout) });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// ─── Calendar ─────────────────────────────────────────────────────────────

async function loadAvailableDates() {
  try {
    const idx = await fetchJson(dataUrl('index.json'));
    availableDates = new Set(idx.dates ?? []);
  } catch {
    availableDates = new Set();
  }
  renderCalendar();
}

function renderCalendar() {
  const today = todayStr();
  const [ty, tm] = today.split('-').map(Number);
  if (!calYear) { calYear = ty; calMonth = tm; }

  // Month label
  document.getElementById('cal-month-label').textContent =
    `${CS_MONTHS_SHORT[calMonth-1]} ${calYear}`;

  // Disable prev/next beyond reasonable range
  document.getElementById('cal-prev').disabled = calYear < 2025;

  const grid = document.getElementById('cal-grid');
  let html = '';

  // Day-of-week headers (Mon first)
  ['Po','Út','St','Čt','Pá','So','Ne'].forEach(d => {
    html += `<div class="cal-cell weekday-label">${d}</div>`;
  });

  // First day of month (0=Sun … 6=Sat → convert to Mon-first)
  const firstDow = new Date(calYear, calMonth-1, 1).getDay(); // 0=Sun
  const startOffset = (firstDow + 6) % 7; // Mon=0 … Sun=6
  const daysInMonth  = new Date(calYear, calMonth, 0).getDate();
  const daysInPrev   = new Date(calYear, calMonth-1, 0).getDate();

  // Leading cells from prev month
  for (let i = startOffset - 1; i >= 0; i--) {
    html += `<div class="cal-cell other-month">${daysInPrev - i}</div>`;
  }

  // Current month days
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calYear}-${String(calMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow = new Date(calYear, calMonth-1, d).getDay(); // 0=Sun, 6=Sat
    const isWeekend  = dow === 0 || dow === 6;
    const isToday    = dateStr === today;
    const hasData    = availableDates.has(dateStr);
    const isSelected = dateStr === selectedDate;
    const isFuture   = dateStr > today;

    let cls = 'cal-cell';
    if (isWeekend) cls += ' weekend';
    if (isToday)   cls += ' today';
    if (hasData)   cls += ' has-data';
    if (isSelected) cls += ' selected';
    if (isFuture && !hasData) cls += ' other-month';

    const onclick = hasData || isToday
      ? `onclick="selectDate('${dateStr}')"`
      : '';

    html += `<div class="${cls}" ${onclick}>${d}</div>`;
  }

  // Trailing cells to complete the grid
  const totalCells = startOffset + daysInMonth;
  const trailing = (7 - totalCells % 7) % 7;
  for (let d = 1; d <= trailing; d++) {
    html += `<div class="cal-cell other-month">${d}</div>`;
  }

  grid.innerHTML = html;
}

function calNav(dir) {
  calMonth += dir;
  if (calMonth > 12) { calMonth = 1; calYear++; }
  if (calMonth < 1)  { calMonth = 12; calYear--; }
  renderCalendar();
}

async function selectDate(date) {
  selectedDate = date;
  document.getElementById('calendar-wrap').hidden = true;
  document.getElementById('cal-btn').classList.remove('active');
  renderCalendar();
  await loadDayData(date);
}

// ─── Data loading ──────────────────────────────────────────────────────────

async function loadDayData(date) {
  const grid = document.getElementById('grid-mine');
  const today = todayStr();
  const isPast = date < today;
  const isToday = date === today;

  // 1. Check localStorage cache
  const cached = store.dayCache(date);
  if (cached) {
    grid.innerHTML = cached.restaurants.map(renderFixedCard).join('');
    const gen = new Date(cached.generatedAt);
    setStatus(`${fmtDate(date)} · z cache · ${gen.toLocaleTimeString('cs-CZ')}`);
    document.getElementById('foot').textContent =
      `data z menicka.cz, namaskar.cz · uloženo ${gen.toLocaleString('cs-CZ')}`;
    return;
  }

  // 2. Try loading from GitHub data/
  if (availableDates.has(date) || isPast) {
    try {
      showSkeletons(grid);
      setStatus(`Načítám ${fmtDate(date)}…`);
      const data = await fetchJson(dataUrl(`${date}.json`));
      grid.innerHTML = data.restaurants.map(renderFixedCard).join('');
      store.setDayCache(date, data);
      const gen = new Date(data.generatedAt);
      setStatus(`${fmtDate(date)} · ${gen.toLocaleTimeString('cs-CZ')}`);
      document.getElementById('foot').textContent =
        `data z menicka.cz, namaskar.cz · ${gen.toLocaleString('cs-CZ')}`;
      return;
    } catch {
      // fall through to scrape (only for today)
    }
  }

  // 3. For today only: scrape live
  if (isToday) {
    await scrapeLiveToday(grid);
    return;
  }

  // 4. No data for this date
  grid.innerHTML = `<div style="grid-column:1/-1">
    <div class="panel-msg">
      <div class="pm-icon">📭</div>
      <h2>Žádná data pro ${fmtDate(date)}</h2>
      <p>Tento den ještě nebyl stažen.</p>
    </div>
  </div>`;
  setStatus('');
}

function showSkeletons(grid) {
  grid.innerHTML = FIXED.map(r => `
    <div class="card">
      <div class="card-head">
        <div><div class="card-name">${esc(r.name)}</div></div>
        <div class="card-icon">${ICONS[r.id]??'🍽'}</div>
      </div>
      <div class="card-divider"></div>
      <div class="card-body">
        <div class="sk" style="width:80%"></div>
        <div class="sk" style="width:58%"></div>
        <div class="sk" style="width:72%"></div>
        <div class="sk" style="width:44%"></div>
      </div>
    </div>`).join('');
}

// ─── Parsers ──────────────────────────────────────────────────────────────

// menicka.cz iframe: div.content per day, h2 (today has span.dnes),
// table.menu with tr.soup/tr.main, td.no/td.food/td.prize.
function parseSectionItems(section) {
  const items = [];
  for (const tr of section.querySelectorAll('tr.soup, tr.main')) {
    const name  = tr.querySelector('td.food')?.textContent.trim() ?? '';
    const price = tr.querySelector('td.prize')?.textContent.trim() ?? '';
    const num   = tr.querySelector('td.no')?.textContent.trim() ?? '';
    if (name && !name.startsWith('Pro tento den')) {
      items.push({ number: num, name, price, isSoup: tr.classList.contains('soup') });
    }
  }
  return items;
}

function parseMenickaIframe(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const now = new Date(), day = now.getDate(), mon = now.getMonth() + 1;
  for (const section of doc.querySelectorAll('div.content')) {
    if (section.querySelector('h2 .dnes')) return parseSectionItems(section);
    const m = section.querySelector('h2')?.textContent.match(/(\d{1,2})\.(\d{1,2})/);
    if (m && +m[1] === day && +m[2] === mon) return parseSectionItems(section);
  }
  return [];
}

// Returns { 'YYYY-MM-DD': items[] } for every day in the iframe response
function parseAllDaysFromIframe(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const result = {};
  for (const section of doc.querySelectorAll('div.content')) {
    const m = section.querySelector('h2')?.textContent.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
    if (!m) continue;
    const dateStr = `${m[3]}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`;
    result[dateStr] = parseSectionItems(section);
  }
  return result;
}

function parseGeneric(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const items = [];

  doc.querySelectorAll('table tr').forEach(tr => {
    const cells = [...tr.querySelectorAll('td')];
    if (cells.length < 2) return;
    const last = cells.at(-1).textContent.trim();
    const price = /^\d+/.test(last) ? last : '';
    const name  = (cells.length >= 3 ? cells[1] : cells[0]).textContent.trim();
    if (name && name.length > 3 && name.length < 180) items.push({ number:'', name, price, isSoup:false });
  });
  if (items.length > 2) return items;

  for (const sel of ['.entry-content','.post-content','article','.poledni-menu','.lunch-menu']) {
    const el = doc.querySelector(sel);
    if (!el) continue;
    const lines = el.textContent.split('\n').map(l=>l.trim()).filter(l=>l.length>4&&l.length<180);
    if (lines.length > 2) {
      lines.forEach((l,i) => items.push({ number:`${i+1}.`, name:l, price:'', isSoup:false }));
      return items;
    }
  }
  return items;
}

// ─── Live scrape (today only) ──────────────────────────────────────────────

async function scrapeLiveToday(grid) {
  showSkeletons(grid);
  setStatus('Scrapy z webu… (GitHub Actions ještě neproběhl)');

  const today = todayStr();
  const allDaysByRestaurant = {};

  const results = await Promise.all(FIXED.map(async r => {
    try {
      const fetchUrl = `https://menicka.cz/api/iframe/?id=${r.menickaId}`;
      const html = await fetchHtml(fetchUrl);
      const allDays = parseAllDaysFromIframe(html);
      allDaysByRestaurant[r.id] = allDays;
      return { ...r, items: allDays[today] ?? [], error: null };
    } catch (e) {
      return { ...r, items: [], error: e.message };
    }
  }));

  // Cache future days that have at least one restaurant's menu
  const futureDates = new Set(
    Object.values(allDaysByRestaurant).flatMap(m => Object.keys(m)).filter(d => d > today)
  );
  for (const date of futureDates) {
    const dayRestaurants = FIXED.map(r => ({
      ...r, items: allDaysByRestaurant[r.id]?.[date] ?? [], error: null,
    }));
    if (dayRestaurants.some(r => r.items.length > 0)) {
      store.setDayCache(date, { date, generatedAt: new Date().toISOString(), restaurants: dayRestaurants });
      availableDates.add(date);
    }
  }
  if (futureDates.size > 0) renderCalendar();

  grid.innerHTML = results.map(renderFixedCard).join('');
  store.setDayCache(today, { date: today, generatedAt: new Date().toISOString(), restaurants: results });

  const errs = results.filter(r=>r.error).length;
  setStatus(errs ? `Hotovo · ${errs} chyb` : `Hotovo · ${new Date().toLocaleTimeString('cs-CZ')}`);
  document.getElementById('foot').textContent = 'data z menicka.cz · live';
}

// ─── Rendering ────────────────────────────────────────────────────────────

function renderMenuItems(items) {
  return items.map(item => {
    if (item.isSoup) return `
      <div class="soup-block">
        <div class="slbl">Polévka</div>
        <div class="soup-row">
          <div class="iname">${esc(item.name)}</div>
          ${item.price ? `<div class="iprice">${esc(item.price)}</div>` : ''}
        </div>
      </div>`;
    return `<div class="item">
      <div class="inum">${esc(item.number)}</div>
      <div class="iname">${esc(item.name)}</div>
      ${item.price ? `<div class="iprice">${esc(item.price)}</div>` : ''}
    </div>`;
  }).join('');
}

function renderFixedCard(r) {
  let domain; try { domain = new URL(r.url).hostname.replace('www.',''); } catch { domain = r.url; }
  let body;
  if (r.error)             body = `<div class="card-err">⚠ ${esc(r.error)}</div>`;
  else if (!r.items?.length) body = `<div class="card-empty">Dnes bez menu.</div>`;
  else                     body = renderMenuItems(r.items);

  return `<div class="card">
    <div class="card-head">
      <div>
        <div class="card-name">${esc(r.name)}</div>
        <div class="card-sub">
          <a class="card-link" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(domain)} ↗</a>
        </div>
      </div>
      <div class="card-icon">${ICONS[r.id]??'🍽'}</div>
    </div>
    <div class="card-divider"></div>
    <div class="card-body">${body}</div>
  </div>`;
}

// ─── Nearby tab — OpenStreetMap Overpass API (free, no key) ───────────────

async function findNearbyOSM(lat, lng, radiusM = 1500, limit = 5) {
  const query = `[out:json][timeout:20];(node["amenity"="restaurant"](around:${radiusM},${lat},${lng});way["amenity"="restaurant"](around:${radiusM},${lat},${lng}););out center ${limit * 4};`;
  const res = await fetch('https://overpass-api.de/api/interpreter', {
    method: 'POST',
    body: 'data=' + encodeURIComponent(query),
    signal: AbortSignal.timeout(25000),
  });
  if (!res.ok) throw new Error(`Overpass ${res.status}`);
  const json = await res.json();
  return (json.elements ?? [])
    .map(el => {
      const tags = el.tags ?? {};
      const elLat = el.lat ?? el.center?.lat;
      const elLon = el.lon ?? el.center?.lon;
      const dist = (elLat != null && elLon != null) ? Math.round(haversine(lat, lng, elLat, elLon)) : Infinity;
      const website = tags.website ?? tags['contact:website'] ?? tags['contact:url'] ?? null;
      const addr = [tags['addr:street'], tags['addr:housenumber']].filter(Boolean).join(' ');
      return { id: String(el.id), name: tags.name, dist, addr, website };
    })
    .filter(p => p.name && p.dist < Infinity)
    .sort((a, b) => a.dist - b.dist)
    .slice(0, limit);
}

async function loadNearby() {
  if (nearbyLoaded) return;
  nearbyLoaded = true;
  const el = document.getElementById('nearby-content');

  const cached = store.nearbyCache();
  if (cached?.places?.length) {
    const g = document.createElement('div'); g.className = 'grid';
    g.innerHTML = cached.places.map(p => renderNearbyCard(p.place, p.menu)).join('');
    el.innerHTML = ''; el.appendChild(g);
    setStatus(`V okolí · z cache · ${new Date(cached.generatedAt).toLocaleTimeString('cs-CZ')}`);
    return;
  }

  el.innerHTML = `<div class="panel-msg">
    <div class="pm-icon">📍</div>
    <h2>Zjistit polohu</h2>
    <p>Potřebujeme tvou polohu pro hledání nejbližších restaurací (OpenStreetMap, bez API klíče).</p>
    <button class="btn-primary" onclick="startNearbySearch()">Povolit polohu</button>
  </div>`;
}

async function searchMenicka(name) {
  try {
    const html = await fetchHtml(`https://www.menicka.cz/vyhledavani/?q=${encodeURIComponent(name)}`);
    const doc  = new DOMParser().parseFromString(html, 'text/html');
    for (const a of doc.querySelectorAll('a[href]')) {
      const href = a.getAttribute('href') || '';
      // Match menicka.cz restaurant page URLs like /3830-suzies-steak-pub.html
      const m = href.match(/\/(\d+)-[\w-]+\.html/);
      if (m) {
        const fullUrl = href.startsWith('http') ? href : 'https://www.menicka.cz' + href;
        // Use the iframe API with the extracted ID
        const id = m[1];
        const iframeHtml = await fetchHtml(`https://menicka.cz/api/iframe/?id=${id}`);
        const items = parseMenickaIframe(iframeHtml);
        if (items.length) return { source: 'menicka', url: fullUrl, items };
      }
    }
  } catch {}
  return null;
}

async function tryWebsiteUrls(base) {
  if (!base) return null;
  base = base.replace(/\/$/, '');
  for (const p of ['/poledni-menu', '/poledni-menu/', '/tydenni-menu', '/lunch', '/denni-menu', '/menu', '/jidelni-listek', '']) {
    try {
      const html  = await fetchHtml(base + p, 10000);
      const items = parseGeneric(html);
      if (items.length > 2) return { source: 'web', url: base + p || base, items };
    } catch {}
  }
  return null;
}

async function resolveNearbyMenu(name, websiteUrl) {
  const mc = await searchMenicka(name);
  if (mc) return mc;
  if (websiteUrl) { const w = await tryWebsiteUrls(websiteUrl); if (w) return w; }
  return { source: 'links', url: websiteUrl, items: [] };
}

function renderFallbackLinks(name, websiteUrl, mapsSearchUrl) {
  const links = [];
  if (websiteUrl) links.push(`<a class="ext-link" href="${esc(websiteUrl)}" target="_blank" rel="noopener"><span class="el-icon">🌐</span><span class="el-text">Web restaurace</span><span class="el-arrow">↗</span></a>`);
  links.push(`<a class="ext-link" href="${esc(mapsSearchUrl)}" target="_blank" rel="noopener"><span class="el-icon">🔍</span><span class="el-text">Hledat polední menu</span><span class="el-arrow">↗</span></a>`);
  return `<div class="link-row">${links.join('')}</div>`;
}

function renderNearbyCard(place, menuResult) {
  // OSM place object: { id, name, dist, addr, website }
  const { name, dist, addr, website } = place;
  const mapsSearch = `https://www.google.com/search?q=${encodeURIComponent(name + ' polední menu Brno')}`;
  let domain; try { domain = website ? new URL(website).hostname.replace('www.', '') : null; } catch {}
  const distHtml = dist != null ? `<span class="dist-badge">${fmtDist(dist)}</span>` : '';

  let body;
  if (menuResult?.items?.length) {
    body = renderMenuItems(menuResult.items);
    body += `<div style="margin-top:7px;font-size:.67rem;color:var(--muted)">zdroj: ${menuResult.source === 'menicka' ? '📋 menicka.cz' : '🌐 web'}</div>`;
  } else {
    body = renderFallbackLinks(name, website, mapsSearch);
  }

  return `<div class="card">
    <div class="card-head">
      <div>
        <div class="card-name">${esc(name)}</div>
        <div class="card-sub">
          ${distHtml}
          ${domain ? `<a class="card-link" href="${esc(website)}" target="_blank" rel="noopener">${esc(domain)} ↗</a>` : ''}
          ${addr ? `<span class="card-addr">${esc(addr)}</span>` : ''}
        </div>
      </div>
      <div class="card-icon">🍽</div>
    </div>
    <div class="card-body">${body}</div>
  </div>`;
}

async function startNearbySearch() {
  const el = document.getElementById('nearby-content');
  el.innerHTML = `<div class="panel-msg"><div class="pm-icon" style="animation:spin 1s linear infinite">⟳</div><h2>Zjišťuji polohu…</h2></div>`;

  let pos;
  try {
    pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { timeout: 10000 }));
  } catch (e) {
    el.innerHTML = `<div class="panel-msg"><div class="pm-icon">⚠</div><h2>Poloha není dostupná</h2><p>${esc(e.message)}</p><button class="btn-primary" onclick="startNearbySearch()">Zkusit znovu</button></div>`;
    return;
  }

  const { latitude: lat, longitude: lng } = pos.coords;
  el.innerHTML = `<div class="panel-msg"><div class="pm-icon" style="animation:spin 1s linear infinite">⟳</div><h2>Hledám restaurace…</h2></div>`;

  let places;
  try {
    places = await findNearbyOSM(lat, lng);
  } catch (e) {
    el.innerHTML = `<div class="panel-msg"><div class="pm-icon">⚠</div><h2>Chyba při hledání</h2><p>${esc(e.message)}</p><button class="btn-primary" onclick="startNearbySearch()">Zkusit znovu</button></div>`;
    return;
  }

  if (!places.length) {
    el.innerHTML = `<div class="panel-msg"><div class="pm-icon">🤷</div><h2>Žádné restaurace v okruhu 1.5 km</h2></div>`;
    return;
  }

  const grid = document.createElement('div'); grid.className = 'grid';
  grid.innerHTML = places.map(p => `
    <div class="card" id="nc-${CSS.escape(p.id)}">
      <div class="card-head">
        <div>
          <div class="card-name">${esc(p.name)}</div>
          <div class="card-sub"><span class="dist-badge">${fmtDist(p.dist)}</span></div>
        </div>
        <div class="card-icon">🍽</div>
      </div>
      <div class="card-body">
        <div class="sk" style="width:80%"></div>
        <div class="sk" style="width:58%"></div>
        <div class="sk" style="width:70%"></div>
      </div>
    </div>`).join('');
  el.innerHTML = ''; el.appendChild(grid);
  setStatus(`Nalezeno ${places.length} restaurací — hledám menu…`);

  const resolved = await Promise.all(places.map(async p => {
    const menu = await resolveNearbyMenu(p.name, p.website ?? null);
    const card = renderNearbyCard(p, menu);
    const old  = grid.querySelector(`#nc-${CSS.escape(p.id)}`);
    if (old) old.outerHTML = card;
    return { place: p, menu };
  }));

  store.setNearbyCache({ generatedAt: new Date().toISOString(), places: resolved });
  setStatus(`Hotovo · ${new Date().toLocaleTimeString('cs-CZ')}`);
}

function refreshToday() {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  const today = todayStr();
  localStorage.removeItem(`menu-${today}`);
  selectedDate = today;
  calYear = null; calMonth = null;
  renderCalendar();
  scrapeLiveToday(document.getElementById('grid-mine'))
    .finally(() => { btn.disabled = false; });

// ─── Calendar toggle ──────────────────────────────────────────────────────

function toggleCalendar() {
  const wrap = document.getElementById('calendar-wrap');
  const btn  = document.getElementById('cal-btn');
  wrap.hidden = !wrap.hidden;
  btn.classList.toggle('active', !wrap.hidden);
}

// ─── Tabs ─────────────────────────────────────────────────────────────────

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('active', t.textContent.includes(tab==='mine'?'hospody':'okolí')));
  document.getElementById('panel-mine').hidden   = tab !== 'mine';
  document.getElementById('panel-nearby').hidden = tab !== 'nearby';
  const calBtn = document.getElementById('cal-btn');
  calBtn.hidden = tab !== 'mine';
  if (tab !== 'mine') document.getElementById('calendar-wrap').hidden = true;
  if (tab === 'nearby') loadNearby();
}

document.getElementById('foot').textContent = 'data z menicka.cz a namaskar.cz';
