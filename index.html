<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polední menu — Brno</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f1117;
      --surface: #1a1d27;
      --sur2:    #22263a;
      --border:  #2e334d;
      --accent:  #6c8aff;
      --text:    #e4e6f0;
      --muted:   #7a7f9a;
      --price:   #a8d8a8;
      --soup-bg: #1a2e26;
      --soup:    #7dd1b0;
      --slbl:    #3d8f6f;
      --err:     #ff6b6b;
      --gold:    #f5c842;
      --r:       14px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    /* ── Header ──────────────────────────────────── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(15,17,23,.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; flex-wrap: wrap;
    }

    .logo { font-size: 1.1rem; font-weight: 700; color: #fff; white-space: nowrap; }
    .logo span { color: var(--accent); }

    .tabs {
      display: flex; gap: 3px;
      background: var(--sur2); border: 1px solid var(--border);
      border-radius: 24px; padding: 3px;
    }
    .tab {
      background: none; border: none; cursor: pointer;
      padding: 6px 16px; border-radius: 20px;
      font-size: .8rem; font-weight: 600; color: var(--muted);
      transition: background .15s, color .15s; white-space: nowrap;
    }
    .tab.active { background: var(--accent); color: #fff; }
    .tab:not(.active):hover { color: var(--text); }

    .header-right { display: flex; align-items: center; gap: 8px; }

    #settings-btn {
      background: none; border: 1px solid var(--border);
      color: var(--muted); border-radius: 8px;
      width: 32px; height: 32px; cursor: pointer; font-size: .95rem;
      display: flex; align-items: center; justify-content: center;
      transition: color .15s, border-color .15s;
    }
    #settings-btn:hover { color: var(--text); border-color: var(--accent); }
    #settings-btn.active { color: var(--accent); border-color: var(--accent); }

    /* ── Settings panel ──────────────────────────── */
    #settings-panel {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 14px 20px; display: none;
    }
    #settings-panel.open { display: block; }

    .settings-inner { max-width: 560px; display: flex; flex-direction: column; gap: 10px; }
    .settings-inner label { font-size: .8rem; color: var(--muted); }
    .settings-row { display: flex; gap: 8px; }
    .settings-row input {
      flex: 1; background: var(--sur2); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 12px; color: var(--text); font-size: .83rem; outline: none;
    }
    .settings-row input:focus { border-color: var(--accent); }
    .settings-row input::placeholder { color: var(--muted); }
    .btn-save {
      background: var(--accent); color: #fff; border: none;
      border-radius: 8px; padding: 7px 16px; font-size: .82rem; font-weight: 600; cursor: pointer;
    }
    .btn-save:hover { opacity: .85; }
    .settings-hint { font-size: .72rem; color: var(--muted); }
    .settings-hint a { color: var(--accent); }

    /* ── Calendar ────────────────────────────────── */
    #calendar-wrap {
      max-width: 360px; margin: 14px auto;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); overflow: hidden;
    }

    .cal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border-bottom: 1px solid var(--border);
    }
    .cal-month { font-weight: 600; font-size: .9rem; }
    .cal-nav {
      background: none; border: 1px solid var(--border);
      color: var(--muted); border-radius: 6px; width: 28px; height: 28px;
      cursor: pointer; font-size: .9rem; display: flex; align-items: center; justify-content: center;
      transition: color .12s, border-color .12s;
    }
    .cal-nav:hover { color: var(--text); border-color: var(--accent); }

    .cal-grid {
      display: grid; grid-template-columns: repeat(7, 1fr);
      padding: 8px;
    }

    .cal-cell {
      aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
      border-radius: 6px; font-size: .78rem; cursor: default;
      position: relative;
    }
    .cal-cell.weekday-label { color: var(--muted); font-size: .68rem; font-weight: 600; }
    .cal-cell.other-month { color: var(--border); }
    .cal-cell.today { color: var(--accent); font-weight: 700; }
    .cal-cell.today::after {
      content: ''; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
      width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
    }
    .cal-cell.has-data {
      cursor: pointer; color: var(--text);
      background: var(--sur2);
    }
    .cal-cell.has-data:hover { background: rgba(108,138,255,.25); }
    .cal-cell.selected {
      background: var(--accent) !important; color: #fff !important;
    }
    .cal-cell.weekend:not(.has-data):not(.selected) { color: var(--muted); }

    /* ── Status ──────────────────────────────────── */
    #status {
      text-align: center; padding: 6px 20px;
      font-size: .74rem; color: var(--muted); min-height: 26px;
    }

    /* ── Grid ────────────────────────────────────── */
    .grid {
      max-width: 1440px; margin: 0 auto;
      padding: 12px 20px 0;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(286px, 1fr));
      gap: 15px;
    }

    /* ── Cards ───────────────────────────────────── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r); display: flex; flex-direction: column;
      transition: border-color .18s, box-shadow .18s;
    }
    .card:hover { border-color: var(--accent); box-shadow: 0 4px 28px rgba(108,138,255,.1); }

    .card-head {
      padding: 12px 14px 10px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
    }
    .card-name { font-weight: 700; font-size: .9rem; color: #fff; }
    .card-sub { display: flex; align-items: center; gap: 6px; margin-top: 3px; flex-wrap: wrap; }
    .card-link { font-size: .67rem; color: var(--muted); text-decoration: none; }
    .card-link:hover { color: var(--accent); }
    .card-addr { font-size: .67rem; color: var(--muted); }
    .card-icon { font-size: 1.25rem; opacity: .3; flex-shrink: 0; }
    .card-body { padding: 9px 14px 12px; flex: 1; }

    .stars { color: var(--gold); font-size: .72rem; letter-spacing: 1px; }
    .rating-num { color: var(--muted); font-size: .7rem; margin-left: 3px; }
    .dist-badge {
      background: var(--sur2); border-radius: 10px;
      padding: 1px 7px; font-size: .66rem; color: var(--muted);
    }

    /* ── Menu items ──────────────────────────────── */
    .item {
      display: flex; gap: 8px; align-items: baseline;
      padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.04);
    }
    .item:last-child { border-bottom: none; }

    .soup-block {
      background: var(--soup-bg); border-radius: 8px;
      padding: 6px 10px; margin: 2px -10px 5px;
    }
    .slbl { font-size: .6rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--slbl); margin-bottom: 3px; }
    .soup-row { display: flex; gap: 8px; align-items: baseline; }
    .soup-block .iname { color: var(--soup); }

    .inum  { color: var(--muted); font-size: .68rem; min-width: 18px; text-align: right; flex-shrink: 0; }
    .iname { flex: 1; font-size: .82rem; line-height: 1.4; }
    .iprice { color: var(--price); font-size: .76rem; font-weight: 600; white-space: nowrap; flex-shrink: 0; }

    /* ── Fallback links ──────────────────────────── */
    .link-row { display: flex; flex-direction: column; gap: 7px; }
    .ext-link {
      display: flex; align-items: center; gap: 8px;
      background: var(--sur2); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 12px; text-decoration: none;
      color: var(--text); font-size: .79rem; transition: border-color .15s;
    }
    .ext-link:hover { border-color: var(--accent); color: var(--accent); }
    .ext-link .el-icon { font-size: .95rem; }
    .ext-link .el-text { flex: 1; }
    .ext-link .el-arrow { color: var(--muted); font-size: .72rem; }

    /* ── States ──────────────────────────────────── */
    .card-empty { color: var(--muted); font-size: .8rem; font-style: italic; }
    .card-err   { color: var(--err);   font-size: .76rem; }

    .sk {
      background: linear-gradient(90deg, var(--sur2) 25%, var(--border) 50%, var(--sur2) 75%);
      background-size: 200% 100%; animation: sh 1.4s infinite;
      border-radius: 5px; height: 12px; margin-bottom: 8px;
    }
    @keyframes sh { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    .panel-msg {
      max-width: 380px; margin: 60px auto; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .panel-msg .pm-icon { font-size: 2.6rem; }
    .panel-msg h2 { color: var(--text); font-size: 1.05rem; font-weight: 600; }
    .panel-msg p { color: var(--muted); font-size: .82rem; line-height: 1.5; }
    .btn-primary {
      background: var(--accent); color: #fff; border: none;
      border-radius: 24px; padding: 9px 22px; font-size: .85rem;
      font-weight: 600; cursor: pointer;
    }
    .btn-primary:hover { opacity: .85; }

    @keyframes spin { to { transform: rotate(360deg); } }

    footer { margin-top: 32px; text-align: center; color: var(--muted); font-size: .72rem; }

    @media (max-width: 520px) {
      header { padding: 9px 12px; }
      .grid { padding: 10px 12px 0; gap: 11px; }
      .tab { padding: 5px 10px; font-size: .76rem; }
      #calendar-wrap { margin: 10px 12px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Polední menu <span>Brno</span></div>
  <div class="header-right">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('mine')">Moje hospody</button>
      <button class="tab"        onclick="switchTab('nearby')">📍 V okolí</button>
    </div>
    <button id="settings-btn" onclick="toggleSettings()" title="Nastavení">⚙</button>
  </div>
</header>

<!-- Settings -->
<div id="settings-panel">
  <div class="settings-inner">
    <label>Google Maps API klíč (pro záložku V okolí)</label>
    <div class="settings-row">
      <input type="password" id="api-key-input" placeholder="AIzaSy…" autocomplete="off" />
      <button class="btn-save" onclick="saveApiKey()">Uložit</button>
    </div>
    <div class="settings-hint">
      <a href="https://console.cloud.google.com/apis/library/places-backend.googleapis.com" target="_blank">Google Cloud Console</a>
      → aktivuj Maps JavaScript API + Places API. Klíč zůstane jen v tvém prohlížeči.
    </div>
  </div>
</div>

<!-- Panel: Moje hospody -->
<div id="panel-mine">
  <!-- Calendar -->
  <div id="calendar-wrap">
    <div class="cal-header">
      <button class="cal-nav" id="cal-prev" onclick="calNav(-1)">‹</button>
      <div class="cal-month" id="cal-month-label"></div>
      <button class="cal-nav" id="cal-next" onclick="calNav(1)">›</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <div id="status"></div>
  <div class="grid" id="grid-mine"></div>
</div>

<!-- Panel: V okolí -->
<div id="panel-nearby" hidden>
  <div id="nearby-content"></div>
</div>

<footer id="foot"></footer>

<script>
// ─── Config ────────────────────────────────────────────────────────────────

const FIXED = [
  { id:'suzies',   name:"Suzie's Steak Pub",  url:'https://www.menicka.cz/3830-suzies-steak-pub.html',    type:'menicka' },
  { id:'seminar',  name:'Hostinec U Semináru', url:'https://www.menicka.cz/3197-hostinec-u-seminaru.html', type:'menicka' },
  { id:'kormidlo', name:'U Kormidla',           url:'https://www.menicka.cz/6690-u-kormidla.html',          type:'menicka' },
  { id:'laguna',   name:'Restaurace Laguna',    url:'https://www.menicka.cz/2701-restaurace-laguna.html',   type:'menicka' },
  { id:'garden',   name:'Garden Food Concept',  url:'https://www.menicka.cz/6361-garden-food-concept.html', type:'menicka' },
  { id:'namaskar', name:'Namaskar',              url:'https://www.namaskar.cz/poledni-menu/',                type:'generic' },
];
const ICONS = { suzies:'🥩', seminar:'🍺', kormidlo:'⚓', laguna:'🐟', garden:'🌿', namaskar:'🍛' };

const PROXY  = u => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`;
const REPO   = 'itsjakubmazur/menu';
const BRANCH = 'main';
// For GitHub Pages: read data from raw content. For localhost: relative path.
const dataUrl = (file) => {
  if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return `data/${file}`;
  return `https://raw.githubusercontent.com/${REPO}/refs/heads/${BRANCH}/data/${file}`;
};

const CS_DAYS   = ['Neděle','Pondělí','Úterý','Středa','Čtvrtek','Pátek','Sobota'];
const CS_MONTHS = ['ledna','února','března','dubna','května','června','července','srpna','září','října','listopadu','prosince'];
const CS_MONTHS_SHORT = ['Led','Úno','Bře','Dub','Kvě','Čvn','Čvc','Srp','Zář','Říj','Lis','Pro'];

// ─── State ────────────────────────────────────────────────────────────────

let availableDates = new Set();   // dates that have data in the repo
let calYear, calMonth;            // currently displayed calendar month
let selectedDate;                 // currently selected date
let activeTab = 'mine';
let gmapsReady = false;
let nearbyLoaded = false;

// ─── Storage ──────────────────────────────────────────────────────────────

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

const store = {
  apiKey() { return localStorage.getItem('gmaps-key') ?? ''; },
  setApiKey(k) { localStorage.setItem('gmaps-key', k); },
  dayCache(date) {
    try { const r = localStorage.getItem(`menu-${date}`); return r ? JSON.parse(r) : null; } catch { return null; }
  },
  setDayCache(date, d) { try { localStorage.setItem(`menu-${date}`, JSON.stringify(d)); } catch {} },
  nearbyCache() {
    try { const r = localStorage.getItem('menu-nearby-'+todayStr()); return r ? JSON.parse(r) : null; } catch { return null; }
  },
  setNearbyCache(d) { try { localStorage.setItem('menu-nearby-'+todayStr(), JSON.stringify(d)); } catch {} },
};

// ─── Helpers ──────────────────────────────────────────────────────────────

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function fmtDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  return `${CS_DAYS[d.getDay()]} ${d.getDate()}. ${CS_MONTHS[d.getMonth()]}`;
}

function fmtDist(m) { return m < 1000 ? `${Math.round(m)} m` : `${(m/1000).toFixed(1)} km`; }

function renderStars(r) {
  const n = Math.round(r * 2) / 2;
  let s = '';
  for (let i = 1; i <= 5; i++) s += i <= n ? '★' : (i-.5 === n ? '½' : '☆');
  return `<span class="stars">${s}</span><span class="rating-num">${r.toFixed(1)}</span>`;
}

function setStatus(msg) { document.getElementById('status').textContent = msg; }

// ─── Network ──────────────────────────────────────────────────────────────

async function fetchHtml(url, timeout = 18000) {
  const res = await fetch(PROXY(url), { signal: AbortSignal.timeout(timeout) });
  if (!res.ok) throw new Error(`proxy ${res.status}`);
  const j = await res.json();
  if (!j.contents) throw new Error('empty response');
  return j.contents;
}

async function fetchJson(url, timeout = 8000) {
  const res = await fetch(url + '?v=' + Date.now(), { signal: AbortSignal.timeout(timeout) });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// ─── Calendar ─────────────────────────────────────────────────────────────

async function loadAvailableDates() {
  try {
    const idx = await fetchJson(dataUrl('index.json'));
    availableDates = new Set(idx.dates ?? []);
  } catch {
    availableDates = new Set();
  }
  renderCalendar();
}

function renderCalendar() {
  const today = todayStr();
  const [ty, tm] = today.split('-').map(Number);
  if (!calYear) { calYear = ty; calMonth = tm; }

  // Month label
  document.getElementById('cal-month-label').textContent =
    `${CS_MONTHS_SHORT[calMonth-1]} ${calYear}`;

  // Disable prev/next beyond reasonable range
  document.getElementById('cal-prev').disabled = calYear < 2025;

  const grid = document.getElementById('cal-grid');
  let html = '';

  // Day-of-week headers (Mon first)
  ['Po','Út','St','Čt','Pá','So','Ne'].forEach(d => {
    html += `<div class="cal-cell weekday-label">${d}</div>`;
  });

  // First day of month (0=Sun … 6=Sat → convert to Mon-first)
  const firstDow = new Date(calYear, calMonth-1, 1).getDay(); // 0=Sun
  const startOffset = (firstDow + 6) % 7; // Mon=0 … Sun=6
  const daysInMonth  = new Date(calYear, calMonth, 0).getDate();
  const daysInPrev   = new Date(calYear, calMonth-1, 0).getDate();

  // Leading cells from prev month
  for (let i = startOffset - 1; i >= 0; i--) {
    html += `<div class="cal-cell other-month">${daysInPrev - i}</div>`;
  }

  // Current month days
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calYear}-${String(calMonth).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow = new Date(calYear, calMonth-1, d).getDay(); // 0=Sun, 6=Sat
    const isWeekend  = dow === 0 || dow === 6;
    const isToday    = dateStr === today;
    const hasData    = availableDates.has(dateStr);
    const isSelected = dateStr === selectedDate;
    const isFuture   = dateStr > today;

    let cls = 'cal-cell';
    if (isWeekend) cls += ' weekend';
    if (isToday)   cls += ' today';
    if (hasData)   cls += ' has-data';
    if (isSelected) cls += ' selected';
    if (isFuture && !hasData) cls += ' other-month';

    const onclick = hasData || isToday
      ? `onclick="selectDate('${dateStr}')"`
      : '';

    html += `<div class="${cls}" ${onclick}>${d}</div>`;
  }

  // Trailing cells to complete the grid
  const totalCells = startOffset + daysInMonth;
  const trailing = (7 - totalCells % 7) % 7;
  for (let d = 1; d <= trailing; d++) {
    html += `<div class="cal-cell other-month">${d}</div>`;
  }

  grid.innerHTML = html;
}

function calNav(dir) {
  calMonth += dir;
  if (calMonth > 12) { calMonth = 1; calYear++; }
  if (calMonth < 1)  { calMonth = 12; calYear--; }
  renderCalendar();
}

async function selectDate(date) {
  selectedDate = date;
  renderCalendar(); // update selected highlight
  await loadDayData(date);
}

// ─── Data loading ──────────────────────────────────────────────────────────

async function loadDayData(date) {
  const grid = document.getElementById('grid-mine');
  const today = todayStr();
  const isPast = date < today;
  const isToday = date === today;

  // 1. Check localStorage cache
  const cached = store.dayCache(date);
  if (cached) {
    grid.innerHTML = cached.restaurants.map(renderFixedCard).join('');
    const gen = new Date(cached.generatedAt);
    setStatus(`${fmtDate(date)} · z cache · ${gen.toLocaleTimeString('cs-CZ')}`);
    document.getElementById('foot').textContent =
      `data z menicka.cz, namaskar.cz · uloženo ${gen.toLocaleString('cs-CZ')}`;
    return;
  }

  // 2. Try loading from GitHub data/
  if (availableDates.has(date) || isPast) {
    try {
      showSkeletons(grid);
      setStatus(`Načítám ${fmtDate(date)}…`);
      const data = await fetchJson(dataUrl(`${date}.json`));
      grid.innerHTML = data.restaurants.map(renderFixedCard).join('');
      store.setDayCache(date, data);
      const gen = new Date(data.generatedAt);
      setStatus(`${fmtDate(date)} · ${gen.toLocaleTimeString('cs-CZ')}`);
      document.getElementById('foot').textContent =
        `data z menicka.cz, namaskar.cz · ${gen.toLocaleString('cs-CZ')}`;
      return;
    } catch {
      // fall through to scrape (only for today)
    }
  }

  // 3. For today only: scrape live
  if (isToday) {
    await scrapeLiveToday(grid);
    return;
  }

  // 4. No data for this date
  grid.innerHTML = `<div style="grid-column:1/-1">
    <div class="panel-msg">
      <div class="pm-icon">📭</div>
      <h2>Žádná data pro ${fmtDate(date)}</h2>
      <p>Tento den ještě nebyl stažen.</p>
    </div>
  </div>`;
  setStatus('');
}

function showSkeletons(grid) {
  grid.innerHTML = FIXED.map(r => `
    <div class="card">
      <div class="card-head">
        <div><div class="card-name">${esc(r.name)}</div></div>
        <div class="card-icon">${ICONS[r.id]??'🍽'}</div>
      </div>
      <div class="card-body">
        <div class="sk" style="width:80%"></div>
        <div class="sk" style="width:58%"></div>
        <div class="sk" style="width:72%"></div>
        <div class="sk" style="width:44%"></div>
      </div>
    </div>`).join('');
}

// ─── Parsers ──────────────────────────────────────────────────────────────

function parseMenicka(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const now = new Date(), day = now.getDate(), mon = now.getMonth()+1;
  const items = [];

  doc.querySelectorAll('.menicka').forEach(sec => {
    const h = sec.querySelector('h2.nadpis, h2');
    if (!h) return;
    const m = h.textContent.match(/(\d{1,2})\.\s*(\d{1,2})/);
    if (!m || +m[1] !== day || +m[2] !== mon) return;
    sec.querySelectorAll('li.polevka, li.jidlo').forEach(li => {
      const name  = li.querySelector('.nazev')?.textContent.trim();
      const price = li.querySelector('.cena')?.textContent.trim().replace(/\s+/g,' ');
      const num   = li.querySelector('.cislo')?.textContent.trim() ?? '';
      if (name) items.push({ number:num, name, price:price??'', isSoup:li.classList.contains('polevka') });
    });
  });

  if (!items.length) {
    doc.querySelectorAll('ul.jidla li').forEach(li => {
      const name  = li.querySelector('.nazev')?.textContent.trim();
      const price = li.querySelector('.cena')?.textContent.trim().replace(/\s+/g,' ');
      const num   = li.querySelector('.cislo')?.textContent.trim() ?? '';
      if (name) items.push({ number:num, name, price:price??'', isSoup:li.classList.contains('polevka') });
    });
  }
  return items;
}

function parseGeneric(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const items = [];

  doc.querySelectorAll('table tr').forEach(tr => {
    const cells = [...tr.querySelectorAll('td')];
    if (cells.length < 2) return;
    const last = cells.at(-1).textContent.trim();
    const price = /^\d+/.test(last) ? last : '';
    const name  = (cells.length >= 3 ? cells[1] : cells[0]).textContent.trim();
    if (name && name.length > 3 && name.length < 180) items.push({ number:'', name, price, isSoup:false });
  });
  if (items.length > 2) return items;

  for (const sel of ['.entry-content','.post-content','article','.poledni-menu','.lunch-menu']) {
    const el = doc.querySelector(sel);
    if (!el) continue;
    const lines = el.textContent.split('\n').map(l=>l.trim()).filter(l=>l.length>4&&l.length<180);
    if (lines.length > 2) {
      lines.forEach((l,i) => items.push({ number:`${i+1}.`, name:l, price:'', isSoup:false }));
      return items;
    }
  }
  return items;
}

// ─── Live scrape (today only) ──────────────────────────────────────────────

async function scrapeLiveToday(grid) {
  showSkeletons(grid);
  setStatus('Scrapy z webu… (GitHub Actions ještě neproběhl)');

  const results = await Promise.all(FIXED.map(async r => {
    try {
      const html  = await fetchHtml(r.url);
      const items = r.type === 'menicka' ? parseMenicka(html) : parseGeneric(html);
      return { ...r, items, error: null };
    } catch (e) {
      return { ...r, items: [], error: e.message };
    }
  }));

  grid.innerHTML = results.map(renderFixedCard).join('');
  const data = { date: todayStr(), generatedAt: new Date().toISOString(), restaurants: results };
  store.setDayCache(todayStr(), data);

  const errs = results.filter(r=>r.error).length;
  setStatus(errs ? `Hotovo · ${errs} chyb` : `Hotovo · ${new Date().toLocaleTimeString('cs-CZ')}`);
  document.getElementById('foot').textContent = 'data z menicka.cz, namaskar.cz · live';
}

// ─── Rendering ────────────────────────────────────────────────────────────

function renderMenuItems(items) {
  return items.map(item => {
    if (item.isSoup) return `
      <div class="soup-block">
        <div class="slbl">Polévka</div>
        <div class="soup-row">
          <div class="iname">${esc(item.name)}</div>
          ${item.price ? `<div class="iprice">${esc(item.price)}</div>` : ''}
        </div>
      </div>`;
    return `<div class="item">
      <div class="inum">${esc(item.number)}</div>
      <div class="iname">${esc(item.name)}</div>
      ${item.price ? `<div class="iprice">${esc(item.price)}</div>` : ''}
    </div>`;
  }).join('');
}

function renderFixedCard(r) {
  let domain; try { domain = new URL(r.url).hostname.replace('www.',''); } catch { domain = r.url; }
  let body;
  if (r.error)             body = `<div class="card-err">⚠ ${esc(r.error)}</div>`;
  else if (!r.items?.length) body = `<div class="card-empty">Dnes bez menu.</div>`;
  else                     body = renderMenuItems(r.items);

  return `<div class="card">
    <div class="card-head">
      <div>
        <div class="card-name">${esc(r.name)}</div>
        <div class="card-sub">
          <a class="card-link" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(domain)} ↗</a>
        </div>
      </div>
      <div class="card-icon">${ICONS[r.id]??'🍽'}</div>
    </div>
    <div class="card-body">${body}</div>
  </div>`;
}

// ─── Nearby tab (unchanged) ────────────────────────────────────────────────

async function loadNearby() {
  if (nearbyLoaded) return;
  nearbyLoaded = true;
  const el = document.getElementById('nearby-content');
  const apiKey = store.apiKey();
  if (!apiKey) {
    el.innerHTML = `<div class="panel-msg">
      <div class="pm-icon">🗝</div>
      <h2>Potřebuješ Google Maps API klíč</h2>
      <p>Klikni na ⚙ vpravo nahoře, vlož klíč a ulož.</p>
      <button class="btn-primary" onclick="toggleSettings()">⚙ Nastavení</button>
    </div>`;
    return;
  }

  const cached = store.nearbyCache();
  if (cached?.places?.length) {
    const g = document.createElement('div'); g.className = 'grid';
    g.innerHTML = cached.places.map(p => renderNearbyCard(p.place, p.dist, p.menu)).join('');
    el.innerHTML = ''; el.appendChild(g);
    setStatus(`V okolí · z cache · ${new Date(cached.generatedAt).toLocaleTimeString('cs-CZ')}`);
    return;
  }

  el.innerHTML = `<div class="panel-msg">
    <div class="pm-icon">📍</div>
    <h2>Zjistit polohu</h2>
    <p>Potřebujeme tvou polohu pro hledání nejbližších restaurací.</p>
    <button class="btn-primary" onclick="startNearbySearch()">Povolit polohu</button>
  </div>`;
}

function loadGmaps(apiKey) {
  if (gmapsReady) return Promise.resolve();
  return new Promise((res, rej) => {
    const cb = '__gmc'+Date.now(); window[cb] = () => { gmapsReady=true; delete window[cb]; res(); };
    const s = document.createElement('script');
    s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(apiKey)}&libraries=places&callback=${cb}`;
    s.onerror = () => rej(new Error('Chyba Google Maps — zkontroluj API klíč'));
    document.head.appendChild(s);
  });
}

function placesNearby(lat, lng) {
  return new Promise((res, rej) => {
    const svc = new google.maps.places.PlacesService(document.createElement('div'));
    svc.nearbySearch({ location: new google.maps.LatLng(lat,lng), radius:1500, type:'restaurant' },
      (results, status) => {
        if (status==='OK'||status==='ZERO_RESULTS') res((results||[]).filter(r=>(r.rating??0)>=4));
        else rej(new Error('Places API: '+status));
      });
  });
}

function getPlaceDetails(placeId) {
  return new Promise(res => {
    const svc = new google.maps.places.PlacesService(document.createElement('div'));
    svc.getDetails({placeId, fields:['website','url']}, (p,s) => res(s==='OK'?p:null));
  });
}

function haversine(la1,lo1,la2,lo2) {
  const R=6371e3, φ1=la1*Math.PI/180, φ2=la2*Math.PI/180;
  const dφ=(la2-la1)*Math.PI/180, dλ=(lo2-lo1)*Math.PI/180;
  const a=Math.sin(dφ/2)**2+Math.cos(φ1)*Math.cos(φ2)*Math.sin(dλ/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

async function searchMenicka(name) {
  try {
    const html = await fetchHtml(`https://www.menicka.cz/vyhledavani/?q=${encodeURIComponent(name)}`);
    const doc  = new DOMParser().parseFromString(html, 'text/html');
    for (const a of doc.querySelectorAll('a[href]')) {
      const href = a.getAttribute('href')||'';
      if (/\/\d+-[\w-]+\.html/.test(href)) {
        const fullUrl = href.startsWith('http') ? href : 'https://www.menicka.cz'+href;
        const mh = await fetchHtml(fullUrl);
        const items = parseMenicka(mh);
        if (items.length) return { source:'menicka', url:fullUrl, items };
      }
    }
  } catch {}
  return null;
}

async function tryWebsiteUrls(base) {
  if (!base) return null;
  base = base.replace(/\/$/,'');
  for (const p of ['/poledni-menu','/poledni-menu/','/tydenni-menu','/lunch','/denni-menu','/menu','/jidelni-listek','']) {
    try {
      const html  = await fetchHtml(base+p, 10000);
      const items = parseGeneric(html);
      if (items.length > 2) return { source:'web', url:base+p||base, items };
    } catch {}
  }
  return null;
}

async function resolveNearbyMenu(name, websiteUrl) {
  const mc = await searchMenicka(name);
  if (mc) return mc;
  if (websiteUrl) { const w = await tryWebsiteUrls(websiteUrl); if (w) return w; }
  return { source:'links', url:websiteUrl, items:[] };
}

function renderFallbackLinks(name, websiteUrl, mapsUrl) {
  const links = [];
  if (websiteUrl) links.push(`<a class="ext-link" href="${esc(websiteUrl)}" target="_blank" rel="noopener"><span class="el-icon">🌐</span><span class="el-text">Web restaurace</span><span class="el-arrow">↗</span></a>`);
  links.push(`<a class="ext-link" href="https://www.google.com/search?q=${encodeURIComponent(name+' polední menu')}" target="_blank" rel="noopener"><span class="el-icon">🔍</span><span class="el-text">Hledat polední menu</span><span class="el-arrow">↗</span></a>`);
  if (mapsUrl) links.push(`<a class="ext-link" href="${esc(mapsUrl)}" target="_blank" rel="noopener"><span class="el-icon">📍</span><span class="el-text">Zobrazit na Google Maps</span><span class="el-arrow">↗</span></a>`);
  return `<div class="link-row">${links.join('')}</div>`;
}

function renderNearbyCard(place, dist, menuResult) {
  const { name, rating, vicinity, place_id } = place;
  const mapsUrl = `https://www.google.com/maps/place/?q=place_id:${place_id}`;
  const website = menuResult?.url && menuResult.source!=='links' ? menuResult.url : null;
  let domain; try { domain = website ? new URL(website).hostname.replace('www.','') : null; } catch {}
  const starsHtml = rating ? renderStars(rating) : '';
  const distHtml  = dist!=null ? `<span class="dist-badge">${fmtDist(dist)}</span>` : '';
  let body;
  if (menuResult?.items?.length) {
    body = renderMenuItems(menuResult.items);
    body += `<div style="margin-top:7px;font-size:.67rem;color:var(--muted)">zdroj: ${menuResult.source==='menicka'?'📋 menicka.cz':'🌐 web'}</div>`;
  } else {
    body = renderFallbackLinks(name, menuResult?.url??null, mapsUrl);
  }
  return `<div class="card">
    <div class="card-head">
      <div>
        <div class="card-name">${esc(name)}</div>
        <div class="card-sub">
          ${starsHtml} ${distHtml}
          ${domain ? `<a class="card-link" href="${esc(menuResult.url)}" target="_blank" rel="noopener">${esc(domain)} ↗</a>` : ''}
          ${vicinity ? `<span class="card-addr">${esc(vicinity)}</span>` : ''}
        </div>
      </div>
      <div class="card-icon">🍽</div>
    </div>
    <div class="card-body">${body}</div>
  </div>`;
}

async function startNearbySearch() {
  const el = document.getElementById('nearby-content');
  el.innerHTML = `<div class="panel-msg"><div class="pm-icon" style="animation:spin 1s linear infinite">⟳</div><h2>Zjišťuji polohu…</h2></div>`;
  let pos;
  try {
    pos = await new Promise((res,rej) => navigator.geolocation.getCurrentPosition(res,rej,{timeout:10000}));
  } catch(e) {
    el.innerHTML = `<div class="panel-msg"><div class="pm-icon">⚠</div><h2>Poloha není dostupná</h2><p>${esc(e.message)}</p><button class="btn-primary" onclick="startNearbySearch()">Zkusit znovu</button></div>`;
    return;
  }
  const {latitude:lat, longitude:lng} = pos.coords;
  el.innerHTML = `<div class="panel-msg"><div class="pm-icon" style="animation:spin 1s linear infinite">⟳</div><h2>Načítám Google Maps…</h2></div>`;
  try { await loadGmaps(store.apiKey()); }
  catch(e) {
    el.innerHTML = `<div class="panel-msg"><div class="pm-icon">⚠</div><h2>${esc(e.message)}</h2><button class="btn-primary" onclick="toggleSettings()">⚙ Opravit klíč</button></div>`;
    return;
  }
  el.innerHTML = `<div class="panel-msg"><div class="pm-icon" style="animation:spin 1s linear infinite">⟳</div><h2>Hledám restaurace…</h2></div>`;
  let places;
  try { places = await placesNearby(lat, lng); }
  catch(e) { el.innerHTML = `<div class="panel-msg"><div class="pm-icon">⚠</div><h2>${esc(e.message)}</h2></div>`; return; }
  if (!places.length) {
    el.innerHTML = `<div class="panel-msg"><div class="pm-icon">🤷</div><h2>Žádné restaurace s hodnocením 4+ v okruhu 1.5 km</h2></div>`;
    return;
  }
  const ranked = places
    .map(p => ({p, dist: haversine(lat,lng,p.geometry.location.lat(),p.geometry.location.lng())}))
    .sort((a,b)=>a.dist-b.dist).slice(0,5);

  const grid = document.createElement('div'); grid.className = 'grid';
  grid.innerHTML = ranked.map(({p}) => `
    <div class="card" id="nc-${CSS.escape(p.place_id)}">
      <div class="card-head">
        <div><div class="card-name">${esc(p.name)}</div>
          <div class="card-sub">${p.rating?renderStars(p.rating):''}</div>
        </div><div class="card-icon">🍽</div>
      </div>
      <div class="card-body">
        <div class="sk" style="width:80%"></div><div class="sk" style="width:58%"></div><div class="sk" style="width:70%"></div>
      </div>
    </div>`).join('');
  el.innerHTML = ''; el.appendChild(grid);
  setStatus(`Nalezeno ${ranked.length} restaurací — hledám menu…`);

  const resolved = await Promise.all(ranked.map(async({p,dist}) => {
    const details = await getPlaceDetails(p.place_id);
    const menu    = await resolveNearbyMenu(p.name, details?.website??null);
    const card = renderNearbyCard(p, dist, menu);
    const old  = grid.querySelector(`#nc-${CSS.escape(p.place_id)}`);
    if (old) old.outerHTML = card;
    return {place:p, dist, menu};
  }));

  store.setNearbyCache({generatedAt:new Date().toISOString(), places:resolved});
  setStatus(`Hotovo · ${new Date().toLocaleTimeString('cs-CZ')}`);
}

// ─── Settings ─────────────────────────────────────────────────────────────

function toggleSettings() {
  const p = document.getElementById('settings-panel');
  const b = document.getElementById('settings-btn');
  const open = !p.classList.contains('open');
  p.classList.toggle('open', open);
  b.classList.toggle('active', open);
  if (open) document.getElementById('api-key-input').value = store.apiKey();
}

function saveApiKey() {
  store.setApiKey(document.getElementById('api-key-input').value.trim());
  toggleSettings();
  if (activeTab === 'nearby') { nearbyLoaded=false; gmapsReady=false; loadNearby(); }
}

// ─── Tabs ─────────────────────────────────────────────────────────────────

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('active', t.textContent.includes(tab==='mine'?'hospody':'okolí')));
  document.getElementById('panel-mine').hidden   = tab !== 'mine';
  document.getElementById('panel-nearby').hidden = tab !== 'nearby';
  if (tab === 'nearby') loadNearby();
}
