name: Scrape menus

on:
  schedule:
    # GitHub runs scheduled workflows "at or after" the cron time, and on this
    # repo they have consistently started 4-7 h late — the 08:30 UTC schedule
    # was landing between 12:50 and 15:11 UTC, long after lunch. Aim early and
    # keep a second run as a backup.
    # 02:00 UTC -> typically lands 06:00-09:00 UTC (08:00-11:00 CEST)
    - cron: '0 2 * * 1-5'
    - cron: '0 5 * * 1-5'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scrape menus
        run: node scraper.js --force

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: menu $(date +%Y-%m-%d)"
          git push
